aid: turbine
name: Turbine
description: >-
  Turbine (Turbine Ltd) is a Budapest-based AI biotechnology company that
  virtualizes biological experiments to accelerate and de-risk drug discovery.
  Its Simulated Cell platform trains virtual cells on genomic, transcriptomic,
  and perturbation-response data, then runs millions of in silico experiments per
  day to predict therapy response across cell lines, patient-derived organoids and
  xenografts, and patient samples. Turbine offers partner-facing products for
  target discovery and de-risking, combination design, and ADC (antibody-drug
  conjugate) intelligence, and works with pharmaceutical partners including
  AstraZeneca and MSD. The company publishes research code and benchmarks on
  GitHub but exposes no public developer API; this profile captures its identity,
  security posture, and web properties for the API Evangelist network.
